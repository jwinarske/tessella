# Vendored from earcutr 0.5.0 (ISC). Two corrections, and changes that find the same ears faster; see PATCH.md.
[package]
name = "earcutr"
version = "0.5.0"
description = "port of MapBox's earcut triangulation code to Rust language"
repository = "https://github.com/frewsxcv/earcutr/"
license = "ISC"
edition = "2021"

# Upstream's code, upstream's lint bar. Named rather than blanket-allowed so a future version that
# fixes this stops needing the entry.
[lints.rust]
mismatched_lifetime_syntaxes = "allow"

[dependencies]
itertools = "0.14"
num-traits = "0.2"

[workspace]
