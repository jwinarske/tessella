# tessella workspace — see plan.md §7 (crate map), §8 (ecosystem reuse), §12.9/DR-12 (build posture).

[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Pinned to the Rust in Yocto wrynose (6.0) oe-core; see rust-toolchain.toml for the
# rationale and the bump policy. Comfortably above the 1.87 that fontdue's use of
# `integer_sign_cast` requires, and above the 1.85 that edition 2024 requires.
rust-version = "1.94.1"
license = "BSD-2-Clause"
authors = ["Joel Winarske <joel.winarske@gmail.com>"]
repository = "https://github.com/jwinarske/tessella"
homepage = "https://github.com/jwinarske/tessella"

[workspace.dependencies]
# --- internal (§7) ---
tessella-capture-abi = { version = "0.0.0", path = "crates/tessella-capture-abi" }
tessella-glyph = { version = "0.0.0", path = "crates/tessella-glyph" }
tessella-layout = { version = "0.0.0", path = "crates/tessella-layout" }
tessella-place = { version = "0.0.0", path = "crates/tessella-place" }
tessella-source = { version = "0.0.0", path = "crates/tessella-source" }
tessella-storage = { version = "0.0.0", path = "crates/tessella-storage" }
tessella-style = { version = "0.0.0", path = "crates/tessella-style" }
tessella-tile = { version = "0.0.0", path = "crates/tessella-tile" }

# --- external, wired (§8). Pure Rust: keeps the riscv64/aarch64 `cargo check` lane
# green without a cross C toolchain (R-6, and DR-16's producer/soak/cross-compile lane).
csscolorparser = "0.8"   # vendored csscolorparser
earcutr = "0.5"          # earcut.hpp — output ordering matters for the §9.1 oracle diff
libm = "0.2"            # core has no sqrt or round; the line generator needs both
fontdue = "0.9"          # local glyph SDF path
geo-types = "0.7"
geojson = "1.0"
glam = "0.33"            # DMat4/DVec — mbgl matrix (§2.2: projMatrix is f64 column-major)
rustybuzz = "0.20"       # harfbuzz
unicode-bidi = "0.3"     # ubidi/ICU
unicode-linebreak = "0.1"
crossbeam = "0.8"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# --- external, recorded but not yet wired (§8) ---
# Pinned here so the §8 table is machine-readable, deliberately not depended on yet:
# the first three build C for the target and would break the cross `cargo check` lane
# until the CI cross toolchains land (§16: emb manifest entries and cross toolchain pins).
rusqlite = { version = "0.40", features = ["bundled"] }  # sqlite vendored (§3.1: the only surviving C)
tempfile = "3"           # for tests that need a real file on disk
# TLS is not in the default set. `rustls` pulls `ring`, which is C and assembly, and the cross
# lane checks the workspace with default features precisely so it needs no cross C toolchain
# (§16). Enabling it per-crate through `tessella-storage`'s `tls` feature keeps that true.
ureq = { version = "3.4", default-features = false, features = ["gzip"] }  # cpp-httplib/curl (§12.6 wants HTTP/2 multiplexing — revisit at R1)
zune-image = "0.5"       # SIMD raster decode straight into the texture slab (§12.2, R3)
geozero = "0.15"         # interim MVT decode; §8 prefers a hand-rolled zero-copy varint reader

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# --- DR-12 build posture (§12.9) ---
[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
# Deliberately not stripped here: with panic=abort a field crash gives an address and
# nothing else, and Yocto already splits debug info into its own -dbg package. Line
# tables are the cheapest thing that keeps a backtrace readable. Not part of DR-12.
debug = "line-tables-only"

# `opt-level = "s"` on non-hot crates. Classification is provisional: tessella-style is listed
# as the `dyn` boundary in §12.9 because *parse* is not hot, but it also houses the DR-11
# expression VM, which is the hottest pure-CPU path in §12.1. Splitting parse from the
# evaluator (a tessella-expr crate) is the likely resolution; until then style stays at
# opt-level 3 and only the I/O-bound crate is size-optimized.
[profile.release.package.tessella-storage]
opt-level = "s"
