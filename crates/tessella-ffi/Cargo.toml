[package]
name = "tessella-ffi"
description = "C ABI for embedding tessella in a consumer's process."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# `staticlib` because a consumer links this into its own shared object: §3.5's
# "staticlib-in-mirror", where the only process coupling is the ring. `cdylib` for the case that
# wants a shared object of its own, and `rlib` so the workspace's own tests can call in without
# going through C.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tessella-capture-abi = { path = "../tessella-capture-abi" }
tessella-glyph = { path = "../tessella-glyph" }
tessella-orchestrate = { path = "../tessella-orchestrate" }

tessella-storage = { path = "../tessella-storage", features = ["http"] }
tessella-style = { path = "../tessella-style" }
tessella-tile = { path = "../tessella-tile" }

[dev-dependencies]
tessella-capture-abi = { path = "../tessella-capture-abi" }
tile-server = { path = "../../tools/tile-server" }

[features]
# A sprite sheet is a PNG, and decoding one is optional the same way it is in the orchestrator:
# without it patterns draw as plain fills and icons not at all, which is the frame a style with
# no `sprite` already produces.
default = ["image"]
image = ["tessella-orchestrate/image", "tessella-glyph/image"]
# HTTPS. Off by default for the reason `tessella-storage` states -- `rustls` brings `ring`, which
# is C and assembly, and the cross lane checks default features exactly so it needs no cross C
# toolchain. On by choice, because without it this surface can load no style anyone actually
# publishes: every style URL in the wild is https, and a consumer meets `TLS required, but
# transport is unsecured` at the status call rather than a map.
tls = ["tessella-storage/tls"]
