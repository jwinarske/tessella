[package]
name = "tessella-orchestrate"
description = "Render layers, tweakers, binders, draw order, UBO packing and damage gates for tessella"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
crossbeam.workspace = true
glam.workspace = true
log.workspace = true
tessella-capture-abi.workspace = true
tessella-glyph.workspace = true
tessella-layout.workspace = true
tessella-place.workspace = true
tessella-source.workspace = true
tessella-storage.workspace = true
tessella-style.workspace = true
libm.workspace = true
tessella-tile.workspace = true

[features]
default = ["std"]
# The cold-start path needs threads and a clock; the rest of the crate does not, and stays
# `no_std` so the discipline marker keeps meaning something.
std = []

[dev-dependencies]
tessella-storage = { workspace = true, features = ["http"] }
tile-server = { path = "../../tools/tile-server" }
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "four_view_sweep"
harness = false
