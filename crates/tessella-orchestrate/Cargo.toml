[package]
name = "tessella-orchestrate"
description = "Render layers, tweakers, binders, draw order, UBO packing and damage gates for tessella"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
crossbeam.workspace = true
log.workspace = true
tessella-capture-abi.workspace = true
tessella-glyph.workspace = true
tessella-layout.workspace = true
tessella-place.workspace = true
tessella-source.workspace = true
tessella-storage.workspace = true
tessella-style.workspace = true
tessella-tile.workspace = true

[features]
default = ["std"]
# The cold-start path needs threads and a clock; the rest of the crate does not, and stays
# `no_std` so the discipline marker keeps meaning something.
std = []
# Region downloads, which need the SQLite store to pin what they fetch. Off by default for the
# reason `tessella-storage`'s `cache` feature is: `rusqlite` bundles C, and the cross lane has
# no toolchain for it.
offline = ["std", "tessella-storage/cache"]
# Sprite sheets and raster tiles, which need image decoders. Off by default for binary size
# (DR-12) rather than for the toolchain — `zune-png` and `zune-jpeg` are pure Rust and cost the
# cross lane nothing.
image = ["tessella-glyph/image"]
# WebP raster tiles, which is what MapTiler and Mapbox serve their satellite and hybrid layers
# as. Its own feature above `image` for the reason `tessella-source` states: a VP8 decoder is a
# lot of code, and it is the one decoder that needs `std`.
webp = ["image", "tessella-glyph/webp"]

[dev-dependencies]
tessella-storage = { workspace = true, features = ["cache", "http", "pmtiles"] }
tempfile = "3"
# The process-isolation spike (plan.md 3.5) needs `mmap`, which std has no equivalent of, and a
# producer that maps a file rather than a `Vec` is the whole point of it. Dev-only, and already
# in the tree by way of `tempfile`, so the cross-compile lane is unaffected -- `libc` is bindings
# rather than C, and builds for a target without a C toolchain for it.
libc = "0.2"
tile-server = { path = "../../tools/tile-server" }
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "four_view_sweep"
harness = false

[[bench]]
name = "expression_cost"
harness = false
