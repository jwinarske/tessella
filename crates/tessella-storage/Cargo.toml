[package]
name = "tessella-storage"
description = "Online and cache file sources with request coalescing for tessella"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
log.workspace = true
serde_json.workspace = true
tessella-style.workspace = true
tessella-tile.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }

[features]
default = []
cache = ["dep:rusqlite"]
http = ["dep:ureq"]
# HTTPS. Off by default and deliberately so: `rustls` brings `ring`, which is C and assembly,
# and §16's cross lane checks the workspace with default features exactly so that it needs no
# cross C toolchain. A feature nobody enables costs that lane nothing.
tls = ["http", "ureq/rustls"]
# Reading a `.pmtiles` archive in place, with no server in front of it. `flate2` defaults to
# `miniz_oxide`, which is pure Rust, so this costs the cross lane nothing it could not already
# afford — it is a feature only because not every build reads archives.
pmtiles = ["dep:flate2"]

[dev-dependencies]
flate2 = "1"
tempfile = "3"
tessella-source.workspace = true
tile-server = { path = "../../tools/tile-server" }

[lints]
workspace = true
