[package]
name = "tessella-glyph"
description = "Glyph manager, PBF range path and local SDF rasterization for tessella"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
fontdue.workspace = true
serde_json.workspace = true
unicode-bidi.workspace = true
tessella-source.workspace = true
tessella-storage.workspace = true
thiserror.workspace = true

[features]
default = []
# Decoding a sprite sheet, which goes through the shared image decoder a raster tile uses. Off by
# default for the same reason `cache` and `tls` are: a build that draws no icons should not carry
# a PNG and a JPEG decoder, and §16's cross lane checks the workspace with default features. Both
# are pure Rust, so unlike `tls` this costs that lane nothing even when enabled — it is a feature
# for binary size (DR-12), not for the toolchain.
image = ["tessella-source/image"]

[lints]
workspace = true
