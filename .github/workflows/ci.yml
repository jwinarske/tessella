name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned by commit SHA, not by tag: a tag is a movable ref, and
# moving it is the whole shape of a GitHub Actions supply-chain compromise. The trailing
# comment records which tag each SHA was at when pinned.
#
# The toolchain is not installed by an action anywhere below — rust-toolchain.toml pins it
# to the Rust that Yocto wrynose ships, and `rustup show` materializes it.

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The section 13.3 sweep harness. Run rather than merely compiled: its correctness half
      # is asserted in tests, but the timing half rots silently if nothing executes it, and it
      # is the harness the RK3566 measurement will use.
      - name: four-view sweep harness
        run: cargo bench --workspace

  abi-header:
    # The generated C header is the boundary between the Rust producer and a C++ mirror
    # (§3.1). Two independent checks, because generating it proves nothing by itself:
    # --check catches a header stale against the Rust definitions, and compiling it makes a
    # real C compiler evaluate the static assertions on every size, alignment and offset.
    # Unlike the mbgl mirrors this needs no C++ checkout, so it runs on every push.
    name: abi header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo run -p abi-header -- --check
      - name: compile as C11
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude -fsyntax-only tools/abi-header/probe.c
      - name: compile as C++17
        run: g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -x c++ -fsyntax-only tools/abi-header/probe.c

  cross:
    # R-6: layout asserts compile on every target. `cargo check` only — no linking, so no
    # cross C toolchain is needed while the workspace stays pure Rust (see the
    # recorded-but-not-wired deps in the root manifest). riscv64 is DR-16's
    # producer/soak/cross-compile lane: VisionFive 2 builds tessella but does not draw maps.
    name: cross-check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo check --workspace --target ${{ matrix.target }}

  package:
    name: package tessella
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo package -p tessella

  miri:
    # tessella-capture-abi is the only crate in the workspace with unsafe, and the ring's
    # failure mode is an intermittent race rather than a reproducible bug — the class of thing
    # a passing test suite does not rule out. Miri checks aliasing and races under both
    # borrow models and explores many thread interleavings.
    #
    # Advisory, and on nightly, which is the only place Miri exists: it deliberately steps
    # outside the DR-17 pin via RUSTUP_TOOLCHAIN, so nightly breakage cannot block a merge.
    name: miri (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: miri
      - name: stacked borrows
        run: cargo miri test -p tessella-capture-abi
      - name: tree borrows
        run: cargo miri test -p tessella-capture-abi
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # The two concurrent structures get many interleavings each, rather than the one run
      # the steps above give them. This is the step that found the reverse channel's torn
      # seqlock read, which two hundred thousand native iterations never produced.
      - name: many interleavings, ring
        run: cargo miri test -p tessella-capture-abi --lib ring::tests::spsc_across_threads -- --exact
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..12
      - name: many interleavings, reverse channel
        run: cargo miri test -p tessella-capture-abi --lib reverse::tests::concurrent_reads_never_see_a_torn_camera -- --exact
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..12

  stable-canary:
    # Advisory only. The pinned toolchain follows Yocto, not upstream Rust, so breakage on
    # current stable is information about the next bump rather than a reason to block a
    # merge. Overrides rust-toolchain.toml via RUSTUP_TOOLCHAIN.
    name: stable canary (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: stable
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
